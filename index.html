<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 디지털헬스케어 현황판 | (주)사이넥스 헬스케어혁신연구소</title>
<style>
/* Layout: 상단 바 / 지도 75% + 오늘의 헤드라인 25%. 지도는 메르카토르 도법 */
@font-face {
  font-family: "Pretendard Variable";
  src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920; font-style: normal; font-display: swap;
}
/* B안 슬레이트·틸, 라이트 고정 */
:root {
  --bg: #F3F5F6;
  --panel: #FFFFFF;
  --panel-2: #F0F4F4;
  --line: #D2DCDD;
  --text: #122326;
  --muted: #5B6B6E;
  --brand: #12343B;
  --on-brand: #FFFFFF;
  --accent: #2A9D8F;
  --ocean: #D8E3E5;
  --land: #FBFCFC;
  --land-line: #BFCDCF;
  --grat: rgba(18, 52, 59, 0.06);
  --high: #C23B3B;
  --medium: #D98A1C;
  --low: #8A96A6;
  --event: #5A6AA8;
  --card: rgba(255, 255, 255, 0.95);
  --shadow: 0 8px 24px rgba(18, 35, 38, 0.12), 0 1px 3px rgba(18, 35, 38, 0.08);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  display: flex; flex-direction: column; overflow: hidden;
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* 상단 바 */
.topbar {
  display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
  box-shadow: inset 0 -2px 0 var(--accent);
  position: relative; z-index: 30;
}
.brand { display: flex; flex-direction: column; gap: 1px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--brand); text-wrap: balance; }
.brand .sub { font-size: 12px; color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: var(--brand); color: var(--text); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; height: 20px; }
.sev { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--low); }
.sev.high { background: var(--high); } .sev.medium { background: var(--medium); } .sev.event { background: var(--event); border-radius: 2px; transform: rotate(45deg); width: 8px; height: 8px; }
.meta { margin-left: auto; text-align: right; line-height: 1.35; }
.meta .org { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; color: var(--brand); }
.meta .upd { font-size: 11px; color: var(--muted); }
.meta .upd b { color: var(--text); font-weight: 600; }

/* 본문 */
.layout { flex: 1; display: flex; min-height: 0; }
.map-area { position: relative; flex: 1 1 75%; min-width: 0; overflow: hidden; background: var(--ocean); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
#map path { vector-effect: non-scaling-stroke; }
.sea { fill: var(--ocean); }
.grat { fill: none; stroke: var(--grat); stroke-width: 1; }
.land { fill: var(--land); stroke: var(--land-line); stroke-width: 0.5; transition: fill .3s; }
.land.tracked { cursor: pointer; }
.land.tracked.high { fill: color-mix(in srgb, var(--high) 26%, var(--land)); }
.land.tracked.medium { fill: color-mix(in srgb, var(--medium) 28%, var(--land)); }
.land.tracked.low { fill: color-mix(in srgb, var(--low) 30%, var(--land)); }
.land.tracked.event { fill: color-mix(in srgb, var(--event) 22%, var(--land)); }
.land.tracked:hover { filter: brightness(0.96); }
.eu-outline { fill: none; stroke: var(--brand); stroke-width: 1.1; stroke-dasharray: 3 3; opacity: .55; pointer-events: none; }

.overlay { position: absolute; inset: 0; pointer-events: none; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leader { stroke: var(--brand); stroke-width: 1; stroke-opacity: .55; fill: none; }
.tether { stroke: var(--brand); stroke-width: 0.8; stroke-opacity: .35; stroke-dasharray: 2 2; }
.anchor-dot { fill: var(--brand); fill-opacity: .6; }

.badge {
  position: absolute; pointer-events: auto; cursor: pointer;
  border: 0; background: none; padding: 0; width: 0; height: 0;
}
.badge .cnt {
  position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff;
  background: var(--low); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(19, 33, 58, .3);
  font-variant-numeric: tabular-nums;
}
.badge.high .cnt { background: var(--high); animation: pulse 2.2s infinite; }
.badge.medium .cnt { background: var(--medium); }
.badge.event .cnt { background: var(--event); }
.badge .lbl {
  position: absolute; top: -9px; left: 14px; white-space: nowrap;
  font-size: 11.5px; font-weight: 800; color: var(--text); letter-spacing: -0.2px;
  text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 2px var(--bg);
}
.badge.lab-l .lbl { left: auto; right: 14px; }
.badge.lab-t .lbl { left: 50%; transform: translateX(-50%); top: -28px; }
.badge:hover .cnt, .badge:focus-visible .cnt { transform: scale(1.12); }
.badge:focus-visible { outline: none; }
.badge:focus-visible .cnt { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--high) 55%, transparent); }
  70% { box-shadow: 0 0 0 11px color-mix(in srgb, var(--high) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.ring {
  position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  border: 2px solid var(--accent); pointer-events: none; animation: ring 1.8s ease-out infinite;
}
@keyframes ring { from { transform: scale(.45); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }

/* 순환 카드: 제목 + 날짜만 */
.card {
  position: absolute; width: 252px; pointer-events: auto; cursor: pointer; text-align: left;
  background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: opacity .35s ease, transform .35s ease;
}
.card.leaving { opacity: 0; transform: translateY(6px); }
.card:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
.card .c-meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.card .c-title { font-size: 14px; font-weight: 700; line-height: 1.42; letter-spacing: -0.2px; text-wrap: pretty; }

.zoom-ctl {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 14px; z-index: 5;
  display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  background: var(--panel);
}
.zoom-ctl button { width: 32px; height: 30px; border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--text); }
.zoom-ctl button + button { border-top: 1px solid var(--line); }
.zoom-ctl button:hover { background: var(--panel-2); }
.map-msg {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px;
  max-width: 360px; text-align: center; box-shadow: var(--shadow);
}
.map-msg h3 { margin: 0 0 4px; font-size: 15px; }
.map-msg p { margin: 0; color: var(--muted); font-size: 13px; }

/* 서랍 */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20;
  background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(19, 33, 58, .12);
  transform: translateX(102%); transition: transform .28s cubic-bezier(.2, .7, .2, 1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.d-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.3px; flex: 1; min-width: 0; }
.d-head .count { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.d-body { flex: 1; overflow-y: auto; padding: 6px 16px 20px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 8px 0 2px; }
.back:hover { color: var(--text); }
.art .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.pill.high { background: color-mix(in srgb, var(--high) 14%, var(--panel)); color: var(--high); }
.pill.medium { background: color-mix(in srgb, var(--medium) 16%, var(--panel)); color: color-mix(in srgb, var(--medium) 70%, var(--text)); }
.pill.low { background: var(--panel-2); color: var(--muted); }
.cat { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); background: var(--panel-2); }
.art h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; font-weight: 800; letter-spacing: -0.4px; text-wrap: balance; }
.art .byline { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.art .summary { font-size: 14.5px; line-height: 1.75; margin: 0 0 18px; }
.art .src {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2);
}
.art .src .s-name { font-size: 12px; color: var(--muted); }
.art .src .s-name b { display: block; color: var(--text); font-size: 13.5px; }
.btn-link {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--brand); color: var(--on-brand); text-decoration: none;
  font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 8px;
}
.btn-link:hover { filter: brightness(1.08); }

/* 목록 (서랍·헤드라인 공용) */
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; width: 100%; text-align: left; border: 0; background: none; padding: 11px 4px; cursor: pointer; border-radius: 6px; }
.row:hover { background: var(--panel-2); }
.row .sev { margin-top: 6px; }
.row .r-title { font-size: 13.5px; font-weight: 700; line-height: 1.45; letter-spacing: -0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .r-meta { grid-column: 2; display: flex; gap: 8px; font-size: 11.5px; color: var(--muted); }
.row .r-meta .ctry { color: var(--brand); font-weight: 700; }
.row .rank { width: 20px; font-size: 13px; font-weight: 800; color: var(--high); text-align: center; font-variant-numeric: tabular-nums; }

/* 오늘의 헤드라인 */
.headline {
  flex: 0 0 25%; min-width: 300px; max-width: 420px;
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; overflow-y: auto;
}
.h-sec { padding: 16px 18px; }
.h-sec + .h-sec { border-top: 1px solid var(--line); }
.eyebrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.eyebrow h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: var(--brand); }
.eyebrow span { font-size: 11.5px; color: var(--muted); }
.brief p { margin: 0; font-size: 14px; line-height: 1.75; }
.brief p.placeholder { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 -2px 4px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 8px 9px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
.empty-note { color: var(--muted); font-size: 13px; padding: 12px 4px; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px 16px; }
  .meta { margin-left: 0; text-align: left; flex-basis: 100%; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .layout { flex-direction: column; }
  .map-area { flex: none; height: 64vh; min-height: 380px; }
  .headline { flex: none; max-width: none; min-width: 0; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .h-sec { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .drawer { position: fixed; top: auto; left: 0; right: 0; width: 100%; max-height: 78vh; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; transform: translateY(102%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer.open { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .badge.high .cnt, .ring { animation: none; }
  .card, .drawer { transition: none; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>세계 디지털헬스케어 현황판</h1>
    <span class="sub">주요 17개국·EU · 뉴스 최근 14일 · 행사 향후 90일</span>
  </div>
  <div class="filters" role="group" aria-label="주제 필터">
    <button class="chip on" data-cat="all" id="chip-all">전체</button>
    <button class="chip" data-cat="company" id="chip-company">기업·서비스</button>
    <button class="chip" data-cat="policy" id="chip-policy">정책·규제</button>
    <button class="chip" data-cat="investment" id="chip-investment">투자·M&amp;A</button>
    <button class="chip" data-cat="event" id="chip-event">전시·행사</button>
  </div>
  <div class="legend" aria-label="중요도 범례">
    <span><i class="sev high"></i>즉시 확인</span>
    <span><i class="sev medium"></i>주의</span>
    <span><i class="sev"></i>참고</span>
    <span><i class="sev event"></i>행사</span>
  </div>
  <div class="meta">
    <div class="org">(주)사이넥스 헬스케어혁신연구소</div>
    <div class="upd">최종 업데이트 <b class="num" id="updatedAt">-</b> · 매일 07:00 (KST) 갱신</div>
  </div>
</header>

<main class="layout">
  <section class="map-area" id="mapArea" aria-label="세계 지도">
    <svg id="map" role="img" aria-label="국가별 디지털헬스케어 뉴스 지도"></svg>
    <svg id="leaders" aria-hidden="true"></svg>
    <div class="overlay" id="rings"></div>
    <div class="overlay" id="badges"></div>
    <div class="overlay" id="cards"></div>
    <div class="zoom-ctl" role="group" aria-label="지도 확대·축소">
      <button id="zoomIn" aria-label="확대">+</button>
      <button id="zoomOut" aria-label="축소">−</button>
      <button id="zoomReset" aria-label="전체 보기" title="전체 보기"><svg viewBox="0 0 24 24" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="map-msg" id="mapMsg" hidden><h3 id="mapMsgTitle"></h3><p id="mapMsgBody"></p></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
      <div class="d-head">
        <h2 id="drawerTitle">-</h2>
        <button class="icon-btn" id="drawerClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="d-body" id="drawerBody"></div>
    </aside>
  </section>

  <aside class="headline" aria-label="오늘의 헤드라인">
    <section class="h-sec brief">
      <div class="eyebrow"><h2>오늘의 브리핑</h2><span class="num" id="briefDate"></span></div>
      <p id="briefText" class="placeholder">브리핑을 불러오는 중입니다.</p>
    </section>
    <section class="h-sec">
      <div class="eyebrow"><h2>즉시 확인 TOP 5</h2><span id="topScope">전체</span></div>
      <ol class="list" id="topList"></ol>
    </section>
    <section class="h-sec">
      <div class="tabs" role="tablist" aria-label="카테고리별 목록">
        <button class="tab on" role="tab" data-tab="company" id="tab-company">기업·서비스</button>
        <button class="tab" role="tab" data-tab="policy" id="tab-policy">정책·규제</button>
        <button class="tab" role="tab" data-tab="investment" id="tab-investment">투자·M&amp;A</button>
        <button class="tab" role="tab" data-tab="event" id="tab-event">전시·행사</button>
      </div>
      <ul class="list" id="catList"></ul>
    </section>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 대상 국가·지역 ----------
  // at: 배지 위치(경도, 위도) / nudge: 붐비는 곳은 배지를 화면에서 비켜 놓고 점선으로 잇는다 / lab: 이름표 방향
  var PLACES = {
    US: { ko: '미국', id: '840', at: [-98, 39] },
    CA: { ko: '캐나다', id: '124', at: [-106, 57] },
    GB: { ko: '영국', id: '826', at: [-1.8, 52.6], nudge: [-30, -10], lab: 'l' },
    FR: { ko: '프랑스', id: '250', at: [2.4, 46.8], nudge: [-28, 18], lab: 'l' },
    DE: { ko: '독일', id: '276', at: [10.4, 51.2], nudge: [28, -12] },
    CH: { ko: '스위스', id: '756', at: [8.2, 46.8], nudge: [18, 26] },
    EU: { ko: 'EU', id: null, at: [4.35, 50.85], nudge: [-2, -40], lab: 't' },

    JP: { ko: '일본', id: '392', at: [138.5, 36.5] },
    CN: { ko: '중국', id: '156', at: [104, 34], lab: 'l' },
    KR: { ko: '한국', id: '410', at: [127.8, 36.4], nudge: [-6, 8], lab: 'l' },

    if (state.tab === 'event') {
      var today = kstDate();
      tabItems = tabItems.filter(function (n) { return (n.date_end || n.date) >= today; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    } else {
      tabItems.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : rankSort(a, b); });
    }
    var catEl = document.getElementById('catList');
    catEl.innerHTML = tabItems.length ? tabItems.slice(0, 12).map(function (n) { return '<li>' + rowHtml(n) + '</li>'; }).join('')
      : '<li class="empty-note">' + (state.loaded ? (state.tab === 'event' ? '예정된 행사가 없습니다.' : '최근 14일 소식이 없습니다.') : '불러오는 중입니다.') + '</li>';
    bindRows(catEl, false);

    var m = state.meta || {};
    var bt = document.getElementById('briefText');
    if (m.briefing_ko) { bt.textContent = m.briefing_ko; bt.classList.remove('placeholder'); }
    else { bt.textContent = state.loaded ? '오늘 브리핑은 아침 7시 갱신 때 작성됩니다.' : '브리핑을 불러오는 중입니다.'; bt.classList.add('placeholder'); }
    document.getElementById('briefDate').textContent = m.briefing_date ? longDate(m.briefing_date) : '';
    if (m.updatedAt) {
      var f = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('updatedAt').textContent = f.format(new Date(m.updatedAt));
    }
  }

  function setMsg(title, body) {
    var el = document.getElementById('mapMsg');
    if (!title) { el.hidden = true; return; }
    document.getElementById('mapMsgTitle').textContent = title;
    document.getElementById('mapMsgBody').textContent = body;
    el.hidden = false;
  }

  function renderAll() {
    state.byId = {};
    state.all.forEach(function (n) { state.byId[n._id] = n; });
    if (projection) { paintCountries(); drawBadges(); }
    rebuildQueue();
    renderPanel();
    if (state.loaded && !visible().length) setMsg('아직 수집된 소식이 없습니다', '매일 아침 7시(KST)에 자동으로 채워집니다.');
    else setMsg(null);
  }

  // ---------- 필터 · 탭 ----------
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === c); });
      state.filter = c.dataset.cat;
      if (state.filter !== 'all') setTab(state.filter);
      renderAll();
      slots.forEach(function (s) { advance(s); });
      if (drawer.classList.contains('open')) closeDrawer();
    });
  });
  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach(function (x) { var on = x.dataset.tab === tab; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.tab); renderPanel(); });
  });

  // ---------- 확대·축소 ----------
  document.getElementById('zoomIn').addEventListener('click', function () { svg.transition().duration(300).call(zoom.scaleBy, 1.6); });
  document.getElementById('zoomOut').addEventListener('click', function () { svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6); });
  document.getElementById('zoomReset').addEventListener('click', function () { svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity); });

  // ---------- 시작 ----------
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var nw = mapArea.clientWidth, nh = mapArea.clientHeight;
      if (nw === W && nh === H) return;
      var oldSlots = slotCount();
      layoutMap(); drawBadges();
      if (slotCount() !== oldSlots) startRotation(); else placeOverlays();
    }, 150);
  });

  fetch('data/countries-110m.json').then(function (r) { return r.json(); }).then(function (topo) {
    world = topojson.feature(topo, topo.objects.countries);
    world.euMerged = topojson.merge(topo, topo.objects.countries.geometries.filter(function (g) { return EU_MEMBERS.indexOf(g.id) >= 0; }));
    layoutMap();
    renderAll();
    startRotation();
  }).catch(function () {
    setMsg('지도를 불러오지 못했습니다', '페이지를 새로고침해 주세요.');
  });
  renderPanel();

  // ---------- 데이터 (data/news.json, 매일 07:00 KST 예약 작업이 갱신) ----------
  function loadNews() {
    return fetch('data/news.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      state.all = (d.items || []).map(function (n) { var o = Object.assign({}, n); o._id = n.id; return o; });
      state.meta = { updatedAt: d.updatedAt, briefing_ko: d.briefing_ko, briefing_date: d.briefing_date };
      state.loaded = true;
      renderAll();
    }).catch(function () {
      state.loaded = true; renderPanel();
      setMsg('소식을 불러오지 못했습니다', '잠시 후 페이지를 새로고침해 주세요.');
    });
  }
  loadNews();
  // 켜 둔 화면도 하루 한 번 갱신된 내용을 반영하도록 30분마다 다시 읽는다
  setInterval(function () { if (!document.hidden) loadNews(); }, 30 * 60 * 1000);
})();
</script>
</body>
</html>
